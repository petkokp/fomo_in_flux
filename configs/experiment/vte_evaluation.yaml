# @package _global_

# VTE is a pure evaluation method, so we run in zeroshot_only mode,
# which skips the (empty) training phase.
zeroshot_only: True

experiment:
  type: 'class_incremental'
  training: 'contrastive'

  backbone:
    name: openclip_vit_b32
    cache_dir: './cache'
    pretrained: True
    # freeze flags are not strictly necessary as the learner handles it, but good practice
    freeze_features: True
    freeze_head: True
    half_precision: True

  dataset:
    name: ['eurosat']
    sequence: null
    path: './data'
    resize: 224
    img_size: 224
    create_resized_variant_if_possible: True

  evaluation:
    additional_datasets: [
      'imagenet',
      'imagenet_a',
      'imagenet_d',
      'imagenet_r',
      'imagenet_s',
      'imagenet_v2',
    ]

  task:
    # Set to 1 task for a single dataset experiment
    num: 1
    n_samples: 1000 # Example value, adjust as needed
    batch_size: 64
    data_mixture:
      pretraining: 0.0
      update: 1.0
      buffer: 0.0

log:
  group: vte_experiments
  project: continualfomo_vte

continual:
  method: vte
  vte:
    selection_p: 0.1